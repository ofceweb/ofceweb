# Ces champs sont obligatoires et doivent être remplis
title: "Titre du policy brief"
# respecter le format pour la date
date: "YYYY-MM-DD"
# Version de revue du brouillon (v0, v1, ... via pb_version_up()). Supprimée
# par setup_pb() à la publication : un PB publié n'est plus versionné.
version: v0
# Logo du PB (ofce, ife, ife-ofce, ife-cepii, ife-ofce-cepii).
institut: ife
# Série de numérotation du PB (voir pb/index.json dans ofce/wp-registry) ;
# indépendante de `institut`.
pb_series: ife
# Écrite/synchronisée automatiquement par setup_pb() d'après le registre
# central (ofce/wp-registry, sous-dossier pb/) ; lue par les extensions
# ofce-quarto-extensions pour le bandeau "Version provisoire — non publiée".
draft: true
author:
  - name: "Prénom Nom"
    email: "prenom.nom@sciencespo.fr"
    affiliation: "IFE, Sciences Po Paris"
    affiliation-url: "https://ife.eco"

lang: fr

date-modified: last-modified


# Activer pour les commentaires
comments:
  hypothesis: false

# Ce qui suit sera principalement imposé par setup_pb()
project:
  type: ofce-website

execute:
  freeze: auto

website:
  site-url: "https://ofce.github.io/REPO/"
  repo-url: "https://github.com/ofce/REPO/"
  page-navigation: true
  bread-crumbs: true
  favicon: www/fofce-pb.png
  draft-mode: visible
  other-links:
    - text: Annexes
      icon: file-bar-graph
      href: annexes.html
    - text: "Historique des changements"
      icon: newspaper
      href: news.html

format:
  pb-html: default

ofce_pb: true

stage-target: auto

citation:
  type: article-journal
  # container-title est recalculé par setup_pb() d'après la série
  # (pb/index.json).
  container-title: "Policy Brief de l'IFE"
  # issue et url sont calculés automatiquement par setup_pb() une fois `pb`
  # attribué par le registre (ex. issue: "12", url:
  # "https://www.ofce.fr/pb/ife/12/") — ne pas les renseigner manuellement.
  # Chaque série est numérotée à partir de 1, indépendamment de l'année.
