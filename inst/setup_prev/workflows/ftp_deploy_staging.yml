name: Prévisions staging — chiffrement + FTP deploy

on:
  push:
    branches: [site-staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

    steps:
      - name: Checkout site-staging branch
        uses: actions/checkout@v4
        with:
          ref: site-staging
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check STATICRYPT_PASSWORD secret
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Le secret STATICRYPT_PASSWORD n'est pas défini sur ce dépôt."
            echo "::error::Définissez-le via : gh secret set STATICRYPT_PASSWORD"
            exit 1
          fi

      - name: Install staticrypt
        run: npm install -g staticrypt

      - name: Encrypt HTML files with staticrypt
        run: |
          staticrypt ./ \
            --recursive \
            --directory /tmp/staticrypt-out \
            --password "$STATICRYPT_PASSWORD" \
            --short \
            --template-color-primary "#e6142d" \
            --template-color-secondary "#f9f9f3" \
            --template-title "Accès restreint" \
            --template-instructions "Entrez le mot de passe ou contactez un responsable de la page que vous souhaitez atteindre." \
            --template-button "Accès"

          # staticrypt mirrors the source dir name into --directory output,
          # so encrypted files are under /tmp/staticrypt-out/<repo-name>/.
          # Sync from that subdirectory to avoid nesting the encrypted folder inside itself.
          rsync -a "/tmp/staticrypt-out/$(basename "$PWD")/" ./
          rm -rf /tmp/staticrypt-out

      - name: FTP deploy (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.STAGING_USER }}
          password: ${{ secrets.STAGING_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: ${{ vars.FTP_STAGING_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Commit FTP state back to site-staging
        run: |
          git add .ftp-deploy-sync-state.json
          if git diff --staged --quiet; then
            echo "No FTP state changes"
          else
            git commit -m "ftp state ${{ github.run_id }}"
            git push
          fi
