# Ces champs sont obligatoires et doivent être remplis
title: "Titre du document de travail"
# respecter le format pour la date
date: "YYYY-MM-DD"
version: v0
# Destination de déploiement pour les WPs non encore publiés :
# gh-pages = GitHub Pages (brouillon) ; ftp = staging FTP OFCE (en attente d'enregistrement).
stage-target: gh-pages
author:
  - name: "Prénom Nom"
    email: "prenom.nom@sciencespo.fr"
    affiliation: "OFCE, Sciences Po Paris"
    affiliation-url: "https://www.ofce.fr"

lang: fr

date-modified: last-modified


# Activer pour les commentaires
comments:
  hypothesis: false

# Ce qui suit sera principalement imposé par setup_wp()
project:
  type: website

execute:
  freeze: auto

website:
  site-url: "https://ofce.github.io/REPO/"
  repo-url: "https://github.com/ofce/REPO/"
  page-navigation: true
  bread-crumbs: true
  favicon: www/fofce-wp.png
  other-links:
    - text: Annexes
      icon: file-bar-graph
      href: annexes.html
    - text: "Historique des changements"
      icon: newspaper
      href: news.html

format:
  wp-html: default

ofce_wp: true

citation:
  type: article-journal
  container-title: "Document de travail de l'OFCE"
  # issue et url sont calculés automatiquement par setup_wp() une fois `wp`
  # renseigné (ex. issue: "2026-12", url: "https://www.ofce.fr/2026/12/") —
  # ne pas les renseigner manuellement.
