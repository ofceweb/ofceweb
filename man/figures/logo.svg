<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="500" height="580">
  <defs>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA8B5"/>
      <stop offset="100%" stop-color="#4A95A2"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A7A8A"/>
      <stop offset="100%" stop-color="#2D6570"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A8E9B"/>
      <stop offset="100%" stop-color="#3B7E8B"/>
    </linearGradient>
  </defs>

  <!-- Hex outline (dark) -->
  <polygon points="250,10 470,137 470,393 250,520 30,393 30,137"
           fill="#2B2D42" stroke="#1A1C2E" stroke-width="6"/>

  <!-- Six triangular panel backgrounds -->
  <!-- Top-left -->
  <polygon points="250,10 30,137 140,265 250,200" fill="#354058" opacity="0.9"/>
  <!-- Top-right -->
  <polygon points="250,10 470,137 360,265 250,200" fill="#3D4A63" opacity="0.9"/>
  <!-- Left -->
  <polygon points="30,137 30,393 140,265" fill="#3D4A63" opacity="0.9"/>
  <!-- Right -->
  <polygon points="470,137 470,393 360,265" fill="#354058" opacity="0.9"/>
  <!-- Bottom-left -->
  <polygon points="30,393 250,520 250,330 140,265" fill="#3D4A63" opacity="0.9"/>
  <!-- Bottom-right -->
  <polygon points="470,393 250,520 250,330 360,265" fill="#354058" opacity="0.9"/>

  <!-- Central isometric cube -->
  <!-- Top face -->
  <polygon points="250,185 330,230 250,275 170,230" fill="url(#cubeTop)"/>
  <!-- Left face -->
  <polygon points="170,230 250,275 250,345 170,300" fill="url(#cubeLeft)"/>
  <!-- Right face -->
  <polygon points="330,230 250,275 250,345 330,300" fill="url(#cubeRight)"/>

  <!-- "ofceweb" text on cube front -->
  <text x="250" y="308" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="1">ofceweb</text>

  <!-- === PANEL ICONS === -->

  <!-- TOP-LEFT PANEL: Globe/web icon -->
  <g transform="translate(155, 105)" fill="none" stroke="#E8594F" stroke-width="2.5">
    <circle cx="0" cy="0" r="22"/>
    <ellipse cx="0" cy="0" rx="10" ry="22"/>
    <line x1="-22" y1="0" x2="22" y2="0"/>
    <path d="M-20,-10 Q0,-13 20,-10"/>
    <path d="M-20,10 Q0,13 20,10"/>
  </g>

  <!-- TOP-RIGHT PANEL: Browser window -->
  <g transform="translate(335, 105)">
    <rect x="-25" y="-20" width="50" height="40" rx="3" fill="#E8594F" opacity="0.15" stroke="#E8594F" stroke-width="2"/>
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#E8594F" stroke-width="2"/>
    <circle cx="-19" cy="-15" r="2.5" fill="#5BA8B5"/>
    <circle cx="-12" cy="-15" r="2.5" fill="#E8A34F"/>
    <circle cx="-5" cy="-15" r="2.5" fill="#E8594F"/>
    <!-- Content lines -->
    <line x1="-18" y1="-2" x2="10" y2="-2" stroke="#5BA8B5" stroke-width="2"/>
    <line x1="-18" y1="5" x2="5" y2="5" stroke="#5BA8B5" stroke-width="1.5" opacity="0.6"/>
    <line x1="-18" y1="12" x2="15" y2="12" stroke="#5BA8B5" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- LEFT PANEL: Code brackets -->
  <g transform="translate(65, 270)" fill="none" stroke="#E8A34F" stroke-width="3" stroke-linecap="round">
    <path d="M-8,-22 L-18,-0 L-8,22"/>
    <path d="M8,-22 L18,0 L8,22"/>
    <line x1="-5" y1="3" x2="5" y2="-3" stroke="#5BA8B5" stroke-width="2.5"/>
  </g>

  <!-- RIGHT PANEL: Network/nodes -->
  <g transform="translate(430, 270)">
    <line x1="0" y1="-18" x2="-15" y2="8" stroke="#5BA8B5" stroke-width="2"/>
    <line x1="0" y1="-18" x2="15" y2="8" stroke="#5BA8B5" stroke-width="2"/>
    <line x1="-15" y1="8" x2="15" y2="8" stroke="#5BA8B5" stroke-width="2"/>
    <line x1="0" y1="-18" x2="0" y2="20" stroke="#5BA8B5" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="-18" r="6" fill="#E8594F"/>
    <circle cx="-15" cy="8" r="6" fill="#E8594F"/>
    <circle cx="15" cy="8" r="6" fill="#E8A34F"/>
    <circle cx="0" cy="20" r="4" fill="#5BA8B5"/>
  </g>

  <!-- BOTTOM-LEFT PANEL: Document/Quarto page -->
  <g transform="translate(145, 410)">
    <rect x="-20" y="-25" width="40" height="50" rx="3" fill="#E8594F" opacity="0.15" stroke="#E8594F" stroke-width="2"/>
    <!-- Header bar -->
    <rect x="-15" y="-19" width="30" height="8" rx="1" fill="#5BA8B5" opacity="0.7"/>
    <!-- Text lines -->
    <line x1="-15" y1="-4" x2="10" y2="-4" stroke="#AABBC8" stroke-width="2"/>
    <line x1="-15" y1="3" x2="15" y2="3" stroke="#AABBC8" stroke-width="1.5" opacity="0.6"/>
    <line x1="-15" y1="10" x2="8" y2="10" stroke="#AABBC8" stroke-width="1.5" opacity="0.6"/>
    <line x1="-15" y1="17" x2="12" y2="17" stroke="#AABBC8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- BOTTOM-RIGHT PANEL: Deploy/rocket -->
  <g transform="translate(350, 410)">
    <!-- Rocket body -->
    <path d="M0,-28 C8,-20 10,-5 6,8 L-6,8 C-10,-5 -8,-20 0,-28Z" fill="#E8594F"/>
    <!-- Window -->
    <circle cx="0" cy="-10" r="4" fill="#5BA8B5"/>
    <!-- Fins -->
    <path d="M-6,2 L-14,12 L-4,8Z" fill="#E8A34F"/>
    <path d="M6,2 L14,12 L4,8Z" fill="#E8A34F"/>
    <!-- Flame -->
    <path d="M-4,8 Q0,20 4,8" fill="#E8A34F" opacity="0.8"/>
  </g>

  <!-- Hex inner border accent -->
  <polygon points="250,22 460,143 460,387 250,508 40,387 40,143"
           fill="none" stroke="#5BA8B5" stroke-width="1.5" opacity="0.3"/>

  <!-- Subtle panel divider lines -->
  <line x1="250" y1="10" x2="250" y2="200" stroke="#5BA8B5" stroke-width="1" opacity="0.25"/>
  <line x1="30" y1="137" x2="170" y2="230" stroke="#5BA8B5" stroke-width="1" opacity="0.25"/>
  <line x1="470" y1="137" x2="330" y2="230" stroke="#5BA8B5" stroke-width="1" opacity="0.25"/>
  <line x1="250" y1="330" x2="250" y2="520" stroke="#5BA8B5" stroke-width="1" opacity="0.25"/>
  <line x1="30" y1="393" x2="170" y2="300" stroke="#5BA8B5" stroke-width="1" opacity="0.25"/>
  <line x1="470" y1="393" x2="330" y2="300" stroke="#5BA8B5" stroke-width="1" opacity="0.25"/>
</svg>