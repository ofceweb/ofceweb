url: https://ofceweb.github.io/ofceweb/
template:
  bootstrap: 5
  theme: atom-one-light
  bslib:
    base_font: {google: "Open Sans"}
    heading_font: {google: "Open Sans"}
    code_font: {google: "Fira Code"}

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/ofceweb/ofceweb

reference:
- title: Prévisions
  desc: >
    Suite complète pour les dépôts de prévision OFCE (`prev{YY}0{3|9}`).
    Trois modes de déploiement : **staging** (versionné, chiffré en CI via
    staticrypt), **publish** (URL fixe, non chiffré), et **profils personnalisés**
    (arbitrary Quarto profiles avec chiffrement). Le chiffrement des sites staging
    et custom est appliqué par les workflows GitHub Actions — pas localement.
  contents:
  - setup_prev
  - check_prev
  - render_prev
  - stage_prev
  - publish_prev
  - deploy_prev
  - site2staging
  - site2profile
  - prev_version_up
  - push_prev_redirect
  - render_prev_publish
  - preview_qmd

- title: Working papers
  desc: >
    Fonctions pour les dépôts de documents de travail OFCE (WP). Un WP peut
    être en mode brouillon (déployé sur GitHub Pages) ou publié (déployé via
    FTP sur `www.ofce.fr/wp/{annee}/{N}/`). Le chiffrement éventuel est
    appliqué par le workflow GitHub Actions — pas localement.
  contents:
  - setup_wp
  - check_wp
  - render_wp
  - publish_wp
  - deploy_wp
  - rescan_wp
  - wp_version_up

- title: Sites génériques
  desc: >
    Fonctions pour les sites Quarto génériques hébergés sur `www.ofce.fr`.
    Supporte l'hébergement OFCE (FTP via branche de déploiement) et GitHub
    Pages. Le chiffrement staticrypt est appliqué **en CI**, juste avant le
    transfert FTP, via le secret `STATICRYPT_PASSWORD` — aucune manipulation
    locale n'est requise.
  contents:
  - setup_site
  - render_site
  - deploy_site
  - stage_site
  - push_site_redirect
  - rescan_site
  - site_version_up

- title: Fonctions dépréciées
  desc: >
    Ces fonctions géraient autrefois le chiffrement localement. Le chiffrement
    est désormais piloté **exclusivement en CI** via le secret GitHub
    `STATICRYPT_PASSWORD`. Utiliser `gh secret set` / `gh secret delete`
    directement.
  contents:
  - encrypt_site
  - encrypt_wp
  - remove_encrypt

- title: Blog
  desc: >
    Fonctions pour le blog OFCE bilingue (FR/EN). Gère le cache des posts,
    la construction du sitemap et le déploiement incrémental.
  contents:
  - render_blog
  - publish_blog
  - create_blog_version

- title: Page d'accueil
  desc: Fonctions pour le site d'accueil OFCE.
  contents:
  - render_home
  - publish_home

- title: Déploiement & utilitaires
  desc: >
    Fonctions de bas niveau partagées entre les différents types de dépôts :
    push vers une branche de déploiement, déclenchement de workflows GitHub
    Actions avec inputs optionnels, téléchargement de fichiers depuis GitHub.
  contents:
  - site2branch
  - site2publish
  - trigger_action
  - download_gh_dir
  - download_gh_file
  - update_navbar

articles:
- title: Articles
  contents:
  - prerequisites
  - working-papers
  - build-a-site
  - previsions

deploy:
  install_metadata: true

footer:
  structure:
    left: [developed_by]
    right: [rtfm, ccby, built_with]
  components:
    rtfm: RTFM
    ccby: CC BY 4.0
