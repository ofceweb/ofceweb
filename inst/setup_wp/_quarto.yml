# Ces champs sont obligatoires et doivent être remplis
title: "Titre du document de travail"
date: "YYYY-MM-DD"
wp: 10
annee: 2026
version: v0

author:
  - name: "Prénom Nom"
    email: "prenom.nom@sciencespo.fr"
    affiliation: "OFCE, Sciences Po Paris"
    affiliation-url: "https://www.ofce.fr"

lang: fr

date-modified: last-modified


# Activer pour les commentaires
comments:
  hypothesis: false

# Ce qui suit ne doit pas être modifié manuellement
project:
  type: website

execute:
  freeze: auto

website:
  site-url: "https://ofce.github.io/REPO/"
  repo-url: "https://github.com/ofce/REPO/"
  page-navigation: true
  bread-crumbs: true
  favicon: www/ofce_m.png
  navbar:
    title: false
    search: true
    left:
      - text: "WP {{< meta annee >}}-{{< meta wp >}}"
        icon: house
        href: index.html
      - text: Annexes
        icon: file-bar-graph
        href: annexes.html
      - text: Historique
        icon: newspaper
        href: news.html
  other-links:
    - text: Annexes
      icon: file-bar-graph
      href: annexes.html
    - text: "Historique des changements"
      icon: newspaper
      href: news.html

format:
  wp-html: default

ofce_wp: true

citation:
  type: article-journal
  container-title: "Document de travail de l'OFCE"
  # issue et url sont calculés automatiquement par setup_wp() une fois `wp`
  # renseigné (ex. issue: "2026-12", url: "https://www.ofce.fr/2026/12/") —
  # ne pas les renseigner manuellement.
