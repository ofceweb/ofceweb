name: Render & Deploy Staging via FTP

on:
  # Uncomment the push trigger below to activate automatic deployment on push to main
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get install -y cmake libcurl4-openssl-dev libgit2-dev pandoc libmagick++-dev libnode-dev locales fonts-open-sans
          sudo locale-gen fr_FR.UTF-8
          sudo update-locale LANG=fr_FR.UTF-8

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install R packages via renv
        uses: r-lib/actions/setup-renv@v2

      - name: Render site
        env:
          DEPLOY_PAT:          ${{ secrets.DEPLOY_PAT }}
          GITHUB_PAT:          ${{ secrets.GH_PAT }}
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: Rscript -e "ofceweb::render_site(check_repo = FALSE, render_site = FALSE, workers = 4L)"

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USER }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_PUBLISH_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            CNAME
            robots.txt
