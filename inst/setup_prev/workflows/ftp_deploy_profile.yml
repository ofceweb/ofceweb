name: Prévisions profil personnalisé — chiffrement + FTP deploy

on:
  push:
    branches:
      - 'site-**'
      - '!site-staging'
      - '!site-publish'
  workflow_dispatch:
    inputs:
      profile:
        description: "Nom du profil Quarto (ex. review, draft…)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

    steps:
      - name: Résoudre le nom du profil
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE="${{ inputs.profile }}"
          else
            # La branche s'appelle site-{profile} — on retire le préfixe
            PROFILE="${{ github.ref_name }}"
            PROFILE="${PROFILE#site-}"
          fi
          echo "profile=$PROFILE"        >> "$GITHUB_OUTPUT"
          echo "branch=site-$PROFILE"    >> "$GITHUB_OUTPUT"

      - name: Checkout branche site-${{ steps.vars.outputs.profile }}
        uses: actions/checkout@v4
        with:
          ref:   ${{ steps.vars.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Vérifier le secret STATICRYPT_PASSWORD
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Le secret STATICRYPT_PASSWORD n'est pas défini sur ce dépôt."
            echo "::error::Définissez-le via : gh secret set STATICRYPT_PASSWORD"
            exit 1
          fi

      - name: Installer staticrypt
        run: npm install -g staticrypt

      - name: Chiffrer les fichiers HTML avec staticrypt
        run: |
          staticrypt ./ \
            --recursive \
            --directory /tmp/staticrypt-out \
            --password "$STATICRYPT_PASSWORD" \
            --short \
            --remenber 0 \
            --template-color-primary "#e6142d" \
            --template-color-secondary "#f9f9f3" \
            --template-title "Accès restreint" \
            --template-instructions "Entrez le mot de passe ou contactez un responsable de la page que vous souhaitez atteindre." \
            --template-button "Accès"

          # staticrypt reproduit l'arborescence source dans --directory ;
          # on synchronise depuis le sous-dossier pour éviter l'imbrication.
          rsync -a "/tmp/staticrypt-out/$(basename "$PWD")/" ./
          rm -rf /tmp/staticrypt-out

      - name: FTP deploy (profil ${{ steps.vars.outputs.profile }})
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.STAGING_USER }}
          password: ${{ secrets.STAGING_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: ${{ github.event.repository.name }}/${{ steps.vars.outputs.profile }}/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Sauvegarder l'état FTP dans site-${{ steps.vars.outputs.profile }}
        run: |
          git add .ftp-deploy-sync-state.json
          if git diff --staged --quiet; then
            echo "No FTP state changes"
          else
            git commit -m "ftp state ${{ github.run_id }}"
            git push
          fi
