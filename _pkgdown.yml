url: https://ofceweb.github.io/ofceweb/
template:
  bootstrap: 5
  theme: atom-one-light
  bslib:
    base_font: {google: "Arimo"}
    heading_font: {google: "Merriweather"}
    code_font: {google: "Fira Code"}

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Prérequis (authentification gh, github)
        href: articles/prerequisites.html
      - text: Faire un document de travail
        href: articles/working-papers.html
      - text: Faire un mini-site
        href: articles/build-a-site.html
      - text: Faire une prévision
        href: articles/previsions.html
    github:
      icon: fab fa-github
      href: https://github.com/ofceweb/ofceweb

reference:
- title: Dispatch automatique
  desc: >
    Points d'entrée uniques qui détectent le type de dépôt (WP, prévision,
    blog ou site générique) et appellent automatiquement la fonction de
    rendu ou de publication correspondante.
  contents:
  - render
  - publish

- title: Prévisions
  desc: >
    Suite complète pour les dépôts de prévision OFCE (`prev{YY}0{3|9}`).
    Trois modes de déploiement : **staging** (versionné, chiffré en CI via
    staticrypt), **publish** (URL fixe, non chiffré), et **profils personnalisés**
    (arbitrary Quarto profiles avec chiffrement). Le chiffrement des sites staging
    et custom est appliqué par les workflows GitHub Actions — pas localement.
  contents:
  - setup_prev
  - check_prev
  - render_prev
  - stage_prev
  - publish_prev
  - deploy_prev
  - prev_version_up

- title: Working papers
  desc: >
    Fonctions pour les dépôts de documents de travail OFCE (WP). Un WP peut
    être en mode brouillon (déployé sur GitHub Pages) ou publié (déployé via
    FTP sur `www.ofce.fr/wp/{annee}/{N}/`). Le chiffrement éventuel est
    appliqué par le workflow GitHub Actions — pas localement.
  contents:
  - setup_wp
  - check_wp
  - render_wp
  - publish_wp
  - deploy_wp
  - rescan_wp
  - wp_version_up
  - wp_registry_request

- title: Policy briefs
  desc: >
    Fonctions pour les dépôts de policy briefs OFCE (PB). Équivalent PB des
    fonctions *Working papers* ci-dessus : un PB peut être en mode brouillon
    (déployé sur GitHub Pages ou en staging FTP) ou publié (déployé via FTP
    sur `www.ofce.fr/pb/{annee}/{N}/`). Le registre central est partagé avec
    les WP (`ofceweb/wp-registry`, sous-dossier `pb/`).
  contents:
  - setup_pb
  - check_pb
  - render_pb
  - publish_pb
  - deploy_pb
  - rescan_pb
  - pb_version_up
  - pb_registry_request

- title: Sites génériques
  desc: >
    Fonctions pour les sites Quarto génériques hébergés sur `www.ofce.fr`.
    Supporte l'hébergement OFCE (FTP via branche de déploiement) et GitHub
    Pages. Le chiffrement staticrypt est appliqué **en CI**, juste avant le
    transfert FTP, via le secret `STATICRYPT_PASSWORD` — aucune manipulation
    locale n'est requise.
  contents:
  - setup_site
  - render_site
  - deploy_site
  - stage_site
  - push_site_redirect
  - rescan_site
  - site_version_up

- title: Blog
  desc: >
    Fonctions pour le blog OFCE bilingue (FR/EN). Gère le cache des posts,
    la construction du sitemap et le déploiement incrémental.
  contents:
  - check_blog
  - render_blog
  - publish_blog
  - create_blog_version
  - submit_blog

- title: Page d'accueil
  desc: Fonctions pour le site d'accueil OFCE.
  contents:
  - render_home
  - publish_home

- title: Déploiement & utilitaires
  desc: >
    Fonctions de bas niveau partagées entre les différents types de dépôts.
  contents:
    - preview_qmd
    - update_navbar
    - check_fonts
    - download_gh_dir
    - download_gh_file

deploy:
  install_metadata: true

footer:
  structure:
    left: [developed_by]
    right: [rtfm, ccby, built_with]
  components:
    rtfm: RTFM
    ccby: CC BY 4.0
